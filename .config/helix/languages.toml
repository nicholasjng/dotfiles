# Controls which tree-sitter grammars `hx --grammar fetch`/`build` fetch and
# compile (see bin/helix-build). Trim or extend this list to match the
# languages you actually edit.
use-grammars = { only = ["python", "rust", "toml", "bash", "markdown", "c", "cpp", "go"] }

[[language]]
name = "python"

[language.debugger]
name = "debugpy"
transport = "stdio"
command = "python3"
args = ["-m",  "debugpy.adapter"]

[[language.debugger.templates]]
name = "source"
request = "launch"
completion = [ { name = "entrypoint", completion = "filename", default = "." } ]
args = { mode = "debug", program = "{0}"}

